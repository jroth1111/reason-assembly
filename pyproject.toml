[project]
name = "reason-assembly"
version = "0.6.0"
description = "An evidence-backed agent council built for empirical evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai-agents", "agent-council", "evidence", "verification", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pypdf==6.14.2",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/jroth1111/reason-assembly"
Issues = "https://github.com/jroth1111/reason-assembly/issues"
Source = "https://github.com/jroth1111/reason-assembly"

[project.scripts]
reason-assembly = "reason_assembly:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
signing = ["cryptography>=50.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reason_assembly = ["py.typed"]

[tool.setuptools.data-files]
"share/reason-assembly" = ["SKILL.md"]
"share/reason-assembly/agents" = ["agents/openai.yaml"]
"share/reason-assembly/references" = [
  "references/protocol.md",
  "references/provenance.md",
  "references/research.md",
]

[dependency-groups]
dev = [
  "hypothesis==6.138.13",
  "pytest==9.0.3",
  "ruff==0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = ["asyncio: run an async test through the local pytest hook"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
