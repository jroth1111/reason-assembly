[project]
name = "ccycouncil"
version = "0.4.1"
description = "Evidence-backed multi-model deliberation, verification, review, and implementation orchestration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "multi-model", "verification", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pypdf==6.6.0",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/jroth1111/ccycouncil"
Issues = "https://github.com/jroth1111/ccycouncil/issues"
Source = "https://github.com/jroth1111/ccycouncil"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
markers = ["asyncio: run an async test through the local pytest hook"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
