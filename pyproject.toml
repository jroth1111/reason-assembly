[project]
name = "reason-assembly"
version = "0.5.0"
description = "An evidence-backed agent council built for empirical evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai-agents", "agent-council", "evidence", "verification", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pypdf==6.6.0",
  "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/jroth1111/reason-assembly"
Issues = "https://github.com/jroth1111/reason-assembly/issues"
Source = "https://github.com/jroth1111/reason-assembly"

[project.scripts]
reason-assembly = "reason_assembly:main"
ccycouncil = "reason_assembly:legacy_main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "artifacts",
  "catalogue_sync",
  "contracts",
  "deliberation",
  "git_worker",
  "identity",
  "protocols",
  "reason_assembly",
  "reliability",
  "routing",
  "state_compat",
  "transport",
  "v4",
  "v4_state",
  "verification",
]

[tool.setuptools.data-files]
"share/reason-assembly" = ["SKILL.md"]
"share/reason-assembly/agents" = ["agents/openai.yaml"]
"share/reason-assembly/compat/model-council" = ["compat/model-council/SKILL.md"]
"share/reason-assembly/compat/model-council/agents" = [
  "compat/model-council/agents/openai.yaml",
]
"share/reason-assembly/references" = [
  "references/protocol.md",
  "references/provenance.md",
  "references/research.md",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
markers = ["asyncio: run an async test through the local pytest hook"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
